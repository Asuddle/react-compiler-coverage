name: Publish to npm

# Publishes when you push a version tag (e.g. v0.1.8).
#
# Auth: npm Trusted Publishing (OIDC) — no NPM_TOKEN needed.
# One-time setup on npmjs.com (logged in as ahmadtaimoor):
#   Package → react-compiler-coverage → Settings → Trusted publishing
#   → GitHub Actions → User: Asuddle  Repo: react-compiler-coverage
#   → Workflow: publish.yml  → Allowed actions: npm publish
# Also link GitHub at npmjs.com → Account → Profile → Connect GitHub account.
on:
  push:
    tags: ['v*']
  workflow_dispatch: # manual test without a new tag

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm Trusted Publishing + provenance (required)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Do NOT set registry-url — it writes _authToken to .npmrc and breaks OIDC.

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Verify tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json ($PKG)"; exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG.md section found for $VERSION"; exit 1
          fi

      - name: Publish to npm via Trusted Publishing
        run: |
          echo "node $(node --version)  npm $(npm --version)"
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "::error::OIDC token not available. Ensure id-token: write is set on this job."
            exit 1
          fi
          # Strip any _authToken line so npm uses OIDC instead of an empty/wrong token.
          for rc in "$NPM_CONFIG_USERCONFIG" "$HOME/.npmrc"; do
            [ -f "$rc" ] && sed -i '/_authToken/d' "$rc" || true
          done
          unset NODE_AUTH_TOKEN NPM_TOKEN
          if ! npm publish --access public 2>publish.err; then
            echo "--- npm publish failed ---"
            cat publish.err
            if grep -q ENEEDAUTH publish.err; then
              echo ""
              echo "::error::Trusted Publisher is not configured (or does not match this repo/workflow)."
              echo "Fix on npmjs.com → react-compiler-coverage → Settings → Trusted publishing:"
              echo "  GitHub user/org:  Asuddle  (must match github.com/OWNER exactly)"
              echo "  Repository:       react-compiler-coverage"
              echo "  Workflow file:    publish.yml"
              echo "  Allowed actions:  npm publish"
              echo "Also connect GitHub at npmjs.com → Settings → Profile."
              echo ""
              echo "Until that is saved, publish manually from your machine:"
              echo "  npm publish --access public"
            fi
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
