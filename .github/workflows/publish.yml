name: Publish to npm

# Auth: npm Trusted Publishing (OIDC) — the only CI path if your package
# has "disallow tokens" enabled (npm's recommended setting).
#
# One-time setup (logged in as ahmadtaimoor on npmjs.com):
#   1. Profile → Connect GitHub account (Asuddle)
#   2. react-compiler-coverage → Settings → Trusted publishing → GitHub Actions
#      User: Asuddle  Repo: react-compiler-coverage  Workflow: publish.yml
#      Allowed actions: npm publish
#   3. Publishing access: keep default OR "disallow tokens" (both work with OIDC)
#
# NPM_TOKEN does NOT work when "disallow tokens" is enabled on the package.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # required for Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Do NOT set registry-url — breaks OIDC (empty _authToken in .npmrc).

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(node -p "require('./package.json').version")
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        if: github.event_name != 'workflow_dispatch'
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json ($PKG)"; exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v ver="${{ steps.ver.outputs.version }}" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG.md section found for ${{ steps.ver.outputs.version }}"; exit 1
          fi

      - name: Publish to npm (Trusted Publishing / OIDC)
        run: |
          echo "node $(node --version)  npm $(npm --version)"
          # Remove any auth lines so npm uses OIDC, not a blocked/empty token.
          for rc in "$NPM_CONFIG_USERCONFIG" "$HOME/.npmrc"; do
            [ -f "$rc" ] && sed -i '/_authToken/d' "$rc" && sed -i '/always-auth/d' "$rc" || true
          done
          unset NODE_AUTH_TOKEN NPM_TOKEN
          if ! npm publish --access public 2>publish.err; then
            cat publish.err
            echo ""
            if grep -qE 'ENEEDAUTH|E403|403' publish.err; then
              echo "::error::npm rejected the publish."
              echo ""
              echo "If you see 403 with NPM_TOKEN: your package likely has"
              echo "'disallow tokens' enabled — tokens cannot publish, period."
              echo ""
              echo "Fix (5 min, one time):"
              echo "  1. npmjs.com → Settings → Profile → Connect GitHub (Asuddle)"
              echo "  2. npmjs.com → react-compiler-coverage → Settings → Trusted publishing"
              echo "     GitHub Actions | Asuddle | react-compiler-coverage | publish.yml | npm publish"
              echo "  3. Delete NPM_TOKEN from GitHub secrets (not used, may interfere)"
              echo "  4. Re-run this workflow"
              echo ""
              echo "Or publish manually: npm publish --access public  (enter 2FA code)"
            fi
            exit 1
          fi

      - name: Create GitHub Release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
