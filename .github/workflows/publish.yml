name: Publish to npm

# Publishes when you push a version tag like v0.1.4 (what `npm run release`
# does). Auth is via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
# One-time setup on npmjs.com → package Settings → Trusted Publisher:
#   Owner: Asuddle   Repository: react-compiler-coverage   Workflow: publish.yml
# The job also creates a GitHub Release whose notes come from CHANGELOG.md.
# We intentionally trigger only on the tag — not on `release: published` — so
# creating the Release here doesn't re-trigger the job.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm Trusted Publishing + provenance (required)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Verify npm supports Trusted Publishing
        run: |
          node --version
          npm --version
          NODE_MAJOR=$(node -p "process.version.slice(1).split('.')[0]")
          NPM_MAJOR=$(npm --version | cut -d. -f1)
          NPM_MINOR=$(npm --version | cut -d. -f2)
          if [ "$NODE_MAJOR" -lt 22 ]; then
            echo "Node 22.14+ required for npm Trusted Publishing"; exit 1
          fi
          if [ "$NPM_MAJOR" -lt 11 ] || { [ "$NPM_MAJOR" -eq 11 ] && [ "$NPM_MINOR" -lt 5 ]; }; then
            echo "npm 11.5.1+ required for npm Trusted Publishing"; exit 1
          fi

      - name: Verify tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json ($PKG)"; exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Print the lines under "## [VERSION]" up to the next "## [" heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG.md section found for $VERSION"; exit 1
          fi

      # Provenance is automatic with Trusted Publishing; no NPM_TOKEN needed.
      - run: npm publish --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
