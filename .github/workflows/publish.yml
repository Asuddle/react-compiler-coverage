name: Publish to npm

# Publishes when you push a version tag (e.g. v0.1.9).
#
# Requires NPM_TOKEN secret (Granular Access Token):
#   npmjs.com → Access Tokens → Generate New Token → Granular Access Token
#   - Packages: Read and Write
#   - Select package: react-compiler-coverage
#   - Bypass 2FA: ON  ← required for CI
#   GitHub → repo Settings → Secrets → NPM_TOKEN
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm provenance attestations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(node -p "require('./package.json').version")
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Verify tag matches package.json version
        if: github.event_name != 'workflow_dispatch'
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json ($PKG)"; exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v ver="${{ steps.ver.outputs.version }}" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG.md section found for ${{ steps.ver.outputs.version }}"; exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is missing."
            echo "Create a Granular Access Token at https://www.npmjs.com/settings/tokens"
            echo "  - Read and Write packages, scoped to react-compiler-coverage"
            echo "  - Bypass 2FA: ON"
            echo "Add it as NPM_TOKEN at https://github.com/Asuddle/react-compiler-coverage/settings/secrets/actions"
            exit 1
          fi
          if ! npm publish --provenance --access public 2>publish.err; then
            cat publish.err
            if grep -q E403 publish.err; then
              echo "::error::NPM_TOKEN lacks publish permission."
              echo "Create a NEW Granular token with Read+Write on react-compiler-coverage and Bypass 2FA enabled."
              echo "Legacy/Classic tokens no longer work (removed Nov 2025)."
            fi
            exit 1
          fi

      - name: Create GitHub Release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
